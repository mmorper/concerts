<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 220px 80px 450px;
        box-sizing: border-box;
      }
      .year {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 320px;
        font-weight: 500;
        color: #fff;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .venue {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 96px;
        font-weight: 400;
        color: #fff;
        letter-spacing: -0.02em;
        line-height: 1.05;
        text-align: center;
        max-width: 920px;
      }
      .artist-name {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 140px;
        font-weight: 500;
        color: #fff;
        letter-spacing: -0.02em;
        line-height: 1;
        text-align: center;
      }
      .stats {
        font-family: 'Source Sans 3', system-ui, sans-serif;
        font-size: 36px;
        font-weight: 500;
        color: #fff;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-top: 48px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="capability-test"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <div id="s1" class="scene clip" data-start="0" data-duration="2.5" data-track-index="1">
        <div class="year">1990.</div>
      </div>
      <div id="s2" class="scene clip" data-start="2.5" data-duration="1.5" data-track-index="1">
        <div class="venue">Cal State Fullerton.</div>
      </div>
      <div id="s3" class="scene clip" data-start="4" data-duration="2" data-track-index="1">
        <div class="artist-name">Social Distortion</div>
        <div class="stats">34 years &middot; 8 shows</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#s1 .year", { y: 60, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.from("#s2 .venue", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, 2.6);
      tl.from("#s3 .artist-name", { y: 50, opacity: 0, duration: 0.7, ease: "power3.out" }, 4.1);
      tl.from("#s3 .stats", { y: 30, opacity: 0, duration: 0.5, ease: "power2.out" }, 4.4);
      window.__timelines["capability-test"] = tl;
    </script>
  </body>
</html>
