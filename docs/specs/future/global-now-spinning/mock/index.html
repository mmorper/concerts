<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Spinning — Morperhaus Concert Archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f5f3ff; --dim:rgba(237,233,254,.68); --faint:rgba(237,233,254,.42); --accent:#c4b5fd; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#0b0918; color:var(--ink); font-family:'Source Sans 3',system-ui,sans-serif; overflow:hidden; }
  #fit { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:1920px; height:1080px; flex:none; overflow:hidden; transform-origin:center center;
    background: radial-gradient(1100px 620px at 50% 30%, rgba(140,122,224,.26), transparent 62%),
                linear-gradient(180deg,#181334 0%,#1e1b4b 40%,#241253 78%,#2c1660 100%); }

  /* background photos from the night */
  #stage::before { content:""; position:absolute; inset:0; background:radial-gradient(900px 700px at 22% 45%, var(--glow, transparent), transparent 70%); transition:background 1.5s; }
  .bg { position:absolute; inset:-40px; background-size:cover; background-position:center; opacity:0;
        filter:blur(22px) saturate(1.2) brightness(.55); transform:scale(1.08); transition:opacity 2.2s ease; }
  .bg.on { opacity:1; }
  .veil { position:absolute; inset:0; background:
      linear-gradient(90deg, rgba(11,9,24,.78) 0%, rgba(11,9,24,.35) 55%, rgba(11,9,24,.7) 100%),
      linear-gradient(0deg, rgba(11,9,24,.85) 0%, transparent 40%); }

  /* record + sleeve */
  .deck { position:absolute; left:120px; top:150px; width:620px; height:620px; }
  .vinyl { position:absolute; top:20px; left:200px; width:580px; height:580px; border-radius:50%;
    background:
      radial-gradient(circle, var(--label) 0 17%, #0d0d0f 17.3% 18.5%, transparent 18.6%),
      repeating-radial-gradient(circle, #141416 0 2px, #1c1c20 2.6px 3.4px),
      #111;
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.04);
    animation: spin 1.8s linear infinite; transition:left .9s cubic-bezier(.2,.8,.2,1); }
  .vinyl::after { content:""; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 30deg, transparent 0 12%, rgba(255,255,255,.09) 16%, transparent 22% 62%, rgba(255,255,255,.06) 66%, transparent 72%); }
  .vinyl::before { content:""; position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:#0b0918; z-index:2; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .sleeve { position:absolute; inset:0; border-radius:6px; overflow:hidden; background:#222;
    box-shadow:0 40px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.06); }
  .sleeve img { width:100%; height:100%; object-fit:cover; display:block; }
  .gen { position:absolute; inset:0; padding:54px; display:flex; flex-direction:column; justify-content:flex-end; }
  .gen .t { font-family:'Playfair Display',serif; font-size:64px; line-height:1.02; font-weight:700; }
  .gen .a { margin-top:14px; font-size:24px; letter-spacing:.18em; text-transform:uppercase; opacity:.8; }
  .gen .rings { position:absolute; right:-140px; top:-140px; width:520px; height:520px; border-radius:50%;
    background:repeating-radial-gradient(circle, rgba(255,255,255,.10) 0 2px, transparent 2px 26px); }

  /* text column */
  .info { position:absolute; left:930px; right:110px; top:150px; }
  .kicker { display:flex; align-items:center; gap:14px; font-size:22px; font-weight:700; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); }
  .dot { width:12px; height:12px; border-radius:50%; background:#f472b6; box-shadow:0 0 0 0 rgba(244,114,182,.7); animation:pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 14px rgba(244,114,182,0); } 100% { box-shadow:0 0 0 0 rgba(244,114,182,0); } }
  .title { margin-top:26px; font-family:'Playfair Display',serif; font-weight:700; font-size:96px; line-height:1.0; letter-spacing:-.01em;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .artist { margin-top:22px; font-size:40px; font-weight:600; }
  .album { margin-top:8px; font-size:28px; color:var(--dim); font-style:italic; font-family:'Playfair Display',serif; }

  .live { margin-top:54px; padding-top:40px; border-top:1px solid rgba(255,255,255,.14); display:flex; gap:44px; }
  .big { font-family:'Playfair Display',serif; font-weight:700; font-size:150px; line-height:.82; color:#fff; min-width:150px; }
  .big small { font-size:60px; color:var(--accent); }
  .livetxt { flex:1; min-width:0; }
  .livetxt h3 { font-size:34px; font-weight:600; line-height:1.2; }
  .livetxt p { margin-top:8px; font-size:24px; color:var(--dim); }
  .quiet h3 { font-family:'Playfair Display',serif; font-size:64px; font-weight:700; line-height:1.05; }
  .quiet p { font-size:28px; max-width:820px; margin-top:18px; line-height:1.4; }
  .quiet .first { color:var(--accent); font-style:italic; font-family:'Playfair Display',serif; }
  .nights { margin-top:22px; list-style:none; display:grid; gap:9px; grid-template-columns:minmax(0,1fr); }
  .nights li { display:flex; gap:18px; font-size:24px; color:var(--dim); white-space:nowrap; }
  .nights li .v { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .nights li b { color:var(--ink); font-weight:600; min-width:178px; flex:none; }
  .nights li.cam::after { content:"◉ photos"; font-size:17px; letter-spacing:.08em; color:#f9a8d4; margin-left:6px; align-self:center; flex:none; }

  /* photo strip */
  .strip { position:absolute; left:120px; bottom:70px; right:110px; display:flex; align-items:flex-end; gap:22px; }
  .thumbs { display:flex; gap:14px; }
  .thumbs div { width:150px; height:100px; border-radius:6px; background-size:cover; background-position:center; opacity:.55;
                box-shadow:0 10px 30px rgba(0,0,0,.5); transition:opacity .6s, transform .6s; }
  .thumbs div.on { opacity:1; transform:translateY(-6px); outline:2px solid rgba(255,255,255,.8); }
  .cap { font-size:22px; color:var(--dim); line-height:1.35; }
  .cap b { color:var(--ink); font-weight:600; }
  .brand { margin-left:auto; text-align:right; font-family:'Playfair Display',serif; font-size:24px; color:var(--faint); }
  .brand i { display:block; font-family:'Source Sans 3'; font-style:normal; font-size:16px; letter-spacing:.22em; text-transform:uppercase; }

  .fade { animation: fadeUp .9s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }

  /* demo controls (not part of the TV screen) */
  #toggle { position:fixed; right:16px; bottom:16px; z-index:20; padding:11px 16px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
            background:rgba(30,27,75,.85); color:#fff; font:600 15px 'Source Sans 3',sans-serif; backdrop-filter:blur(8px); cursor:pointer; }
  #panel { position:fixed; right:16px; bottom:70px; z-index:20; width:min(400px, calc(100vw - 32px)); max-height:calc(100vh - 100px); overflow:auto;
           background:rgba(24,19,52,.96); border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:18px; display:none;
           box-shadow:0 20px 60px rgba(0,0,0,.6); font-size:15px; }
  #panel.open { display:block; }
  #panel h4 { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin:4px 0 10px; }
  #panel p { color:var(--dim); line-height:1.4; margin-bottom:12px; }
  #panel input { width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; font:inherit; margin-bottom:8px; }
  #panel button.go { width:100%; padding:10px; border-radius:10px; border:0; background:#7c3aed; color:#fff; font:600 15px inherit; cursor:pointer; margin-bottom:16px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chips button, .res button { border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff; border-radius:999px; padding:7px 12px; font:inherit; font-size:14px; cursor:pointer; text-align:left; }
  .res { display:grid; gap:6px; }
  .res button { border-radius:10px; }
  .res button span { color:var(--faint); }
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="bgA" class="bg"></div><div id="bgB" class="bg"></div><div class="veil"></div>

  <div class="deck">
    <div class="vinyl" id="vinyl"></div>
    <div class="sleeve" id="sleeve"></div>
  </div>

  <div class="info" id="info"></div>

  <div class="strip">
    <div class="thumbs" id="thumbs"></div>
    <div class="cap" id="cap"></div>
    <div class="brand">Morperhaus<i>Concert Archives</i></div>
  </div>
</div></div>

<button id="toggle">Change record</button>
<div id="panel">
  <h4>Pretend Shazam heard…</h4>
  <p>On the real setup, the listener fills these in. Type it the way Shazam would, extra words and all.</p>
  <input id="inArtist" placeholder="Artist, e.g. Depeche Mode">
  <input id="inTitle" placeholder="Song, e.g. Everything Counts (Remastered)">
  <button class="go" id="go">Identify</button>
  <h4>Try one</h4>
  <div class="chips" id="chips"></div>
  <h4>Or search songs you've heard live</h4>
  <input id="search" placeholder="Search songs you've heard live…">
  <div class="res" id="res"></div>
</div>

<script>
let D;
const $ = id => document.getElementById(id);
const slug = s => (s||'').toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
// "&" and "and" are the same word to a billing: Echo & the Bunnymen = Echo and the Bunnymen.
const loose = s => slug(s).replace(/^the-/,'').replace(/(^|-)and(?=-|$)/g,'').replace(/-/g,'');
// Shazam titles carry noise: "(Remastered 2006)", "- Live", "[Single Version]", "feat. X"
const cleanTitle = t => (t||'').replace(/\s*[\(\[][^\)\]]*[\)\]]/g,'')
  .replace(/\s+-\s+.*\b(remaster(ed)?|live|version|mix|edit|mono|stereo|single|demo|bonus)\b.*$/i,'').trim();
const cleanArtist = a => (a||'').replace(/\s+(feat\.?|featuring|ft\.?|with|&|and)\s+.*$/i,'').trim();
const fmt = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const hue = s => { let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))%360; return h; };

let canonOf, billingsOf, byLooseArtist;
let SL;
function index() {
  SL = new Set(D.sl);
  canonOf = a => D.canon[a] || a;
  billingsOf = {};
  for (const a of Object.keys(D.artists)) (billingsOf[canonOf(a)] ||= []).push(a);
  byLooseArtist = {};
  for (const a of Object.keys(D.artists)) byLooseArtist[loose(a)] = a;
}
// Try the name as given first: "Echo and the Bunnymen" and "Joan Jett & The Blackhearts"
// are real billings, so stripping "and …"/"& …" up front would turn them into "Echo" / "Joan Jett".
// Only fall back to the cleaned name (drops "feat. X", "& Y") when the full name misses.
function findArtist(name) {
  for (const n of [name, cleanArtist(name)]) {
    if (D.artists[slug(n)]) return canonOf(slug(n));
    const l = byLooseArtist[loose(n)];
    if (l) return canonOf(l);
  }
  return null;
}
function showsFor(canon) {
  const out = [];
  for (const b of billingsOf[canon] || []) for (const s of D.artists[b].s) out.push({date:s[0],venue:s[1],city:s[2],role:s[3],billing:b});
  return out.sort((x,y)=>x.date.localeCompare(y.date));
}
function photosFor(nights) {
  const ps = [];
  for (const n of [...nights].reverse()) for (const p of D.photos[n.date+'|'+n.billing] || []) ps.push({src:p, night:n});
  return ps;
}

// The one function the real listener would call: Shazam's artist + title in, a screen out.
function identify(artistIn, titleIn, extra={}) {
  const canon = findArtist(artistIn);
  const shows = canon ? showsFor(canon) : [];
  const t = loose(cleanTitle(titleIn));
  // one act can play under several billings (Brian Setzer has four), so gather every match
  const matches = canon ? D.songs.filter(s => canonOf(s.a)===canon && loose(cleanTitle(s.n))===t) : [];
  const song = matches[0] || null;
  const played = new Set(matches.flatMap(s => s.d.map(d => d+'|'+s.a)));
  const heard = shows.filter(n => played.has(n.date+'|'+n.billing));
  const withAlbum = matches.find(s => s.al!=null);
  const album = withAlbum ? D.albums[withAlbum.al] : null;
  // No shows? Maybe someone you HAVE seen played their songs.
  let covers = [], coverOfThis = [];
  if (!shows.length) {
    const showOf = (perf, date) => (showsFor(canonOf(perf)).find(x => x.date===date && x.billing===perf));
    covers = (D.cv[loose(cleanArtist(artistIn))] || []).map(([n, perf, date]) => ({ song:n, ...showOf(perf, date) }))
      .filter(x => x.date).sort((a,b)=>a.date.localeCompare(b.date));
    coverOfThis = covers.filter(x => loose(cleanTitle(x.song))===t);
  }
  return {
    covers, coverOfThis,
    title: song ? song.n : cleanTitle(titleIn),
    artist: canon ? (D.artists[canon] || D.artists[billingsOf[canon][0]]).n : cleanArtist(artistIn),
    canon, album: album || extra.album || null, shows, heard, song,
    artistImg: canon ? D.artists[canon]?.i : null
  };
}

let rot = null;
function render(r) {
  const h = hue(r.album?.t || r.title);
  $('vinyl').style.setProperty('--label', `hsl(${(h+180)%360} 70% 55%)`);
  $('vinyl').style.left = '20px'; setTimeout(()=>$('vinyl').style.left='200px', 350);

  // sleeve: real cover where the browser can load it; a drawn sleeve otherwise
  const gen = `<div class="gen" style="background:linear-gradient(150deg,hsl(${h} 55% 42%),hsl(${(h+40)%360} 60% 18%))">
      <div class="rings"></div><div class="t">${esc(r.album?.t || r.title)}</div><div class="a">${esc(r.artist)}</div></div>`;
  $('sleeve').innerHTML = gen + (r.album?.c ? `<img src="${r.album.c}" alt="" onerror="this.remove()" style="position:absolute;inset:0">` : '');

  // the archive's part
  const n = r.heard.length, seen = r.shows.length;
  let live;
  if (n) {
    const last = r.heard[n-1], first = r.heard[0];
    live = `<div class="big">${n}<small>×</small></div><div class="livetxt">
      <h3>${n===1 ? 'You heard this one live, once.' : `You've heard this one live ${n} times.`}</h3>
      ${n>1 ? `<p>First in ${first.date.slice(0,4)} · most recent ${fmt(last.date)}</p>` : ''}
      ${nights(r.heard)}</div>`;
  } else if (seen) {
    const withSl = r.shows.filter(x => SL.has(x.date+'|'+x.billing)).length;
    const times = seen===1 ? 'once' : seen+' times';
    const why = withSl===seen ? `It isn't on any of the setlists from those nights.`
      : withSl===0 ? `There's no setlist from ${seen===1?'that night':'those nights'}, so maybe you did.`
      : `It isn't on the ${withSl} setlist${withSl>1?'s':''} I have. ${seen-withSl} night${seen-withSl>1?'s have':' has'} no setlist.`;
    live = `<div class="big">${seen}<small>×</small></div><div class="livetxt">
      <h3>${withSl===seen ? `You've seen ${esc(r.artist)} ${times}, but never heard this one live.` : `You've seen ${esc(r.artist)} ${times}.`}</h3>
      <p>${why}</p>
      ${nights(r.shows)}</div>`;
  } else if (r.coverOfThis.length) {
    const c = r.coverOfThis, k = c.length, by = [...new Set(c.map(x => D.artists[x.billing].n))];
    live = `<div class="big">${k}<small>×</small></div><div class="livetxt">
      <h3>You've never seen ${esc(r.artist)}. But you've heard this one live, played by ${esc(list(by))}.</h3>
      <p>Not in the archive yet. This song is, though.</p>
      ${nights(c, x => D.artists[x.billing].n)}</div>`;
  } else if (r.covers.length) {
    const c = r.covers, songs = [...new Set(c.map(x => x.song.replace(/"/g,'')))];
    live = `<div class="big">${songs.length}</div><div class="livetxt">
      <h3>You've never seen ${esc(r.artist)}, but you've heard ${songs.length===1 ? 'one of their songs' : songs.length+' of their songs'} live, in other hands.</h3>
      ${nights(c, x => `“${x.song.replace(/"/g,'')}” · ${D.artists[x.billing].n}`)}</div>`;
  } else {
    live = `<div class="livetxt quiet"><h3>Not in the archive. Yet.</h3>
      <p>No ${esc(r.artist)} show on the books, and nobody you've seen has played one of their songs either.</p>
      <p class="first">Maybe this is the one you go see next.</p></div>`;
  }
  $('info').innerHTML = `<div class="fade">
    <div class="kicker"><span class="dot"></span>Now spinning</div>
    <div class="title">${esc(r.title)}</div>
    <div class="artist">${esc(r.artist)}</div>
    ${r.album ? `<div class="album">${esc(r.album.t)}${r.album.y ? ' · '+r.album.y : ''}</div>` : ''}
    <div class="live">${live}</div></div>`;

  // photos from those nights, newest first
  const about = n ? r.heard : seen ? r.shows : (r.coverOfThis.length ? r.coverOfThis : r.covers);
  const ps = photosFor(about);
  clearInterval(rot); let i = 0, flip = false;
  const show = k => {
    const p = ps[k]; if (!p) return;
    const [on, off] = flip ? ['bgA','bgB'] : ['bgB','bgA']; flip = !flip;
    $(on).style.backgroundImage = `url('${p.src}')`; $(on).classList.add('on'); $(off).classList.remove('on');
    [...$('thumbs').children].forEach((t,j)=>t.classList.toggle('on', j===k));
    $('cap').innerHTML = `From the night<br><b>${fmt(p.night.date)}</b> · ${esc(p.night.venue)}`;
  };
  $('thumbs').innerHTML = ps.slice(0,5).map(p=>`<div style="background-image:url('${p.src}')"></div>`).join('');
  if (ps.length) { show(0); rot = setInterval(()=>{ i=(i+1)%Math.min(ps.length,5); show(i); }, 7000); }
  else { $('bgA').classList.remove('on'); $('bgB').classList.remove('on'); $('cap').innerHTML = about.length ? 'No photos from these nights yet' : ''; }
  // with no photos, the room takes its colour from the record
  $('stage').style.setProperty('--glow', `hsla(${h} 70% 55% / ${ps.length ? 0 : .32})`);
}
function nights(list, label) {
  const cams = new Set(Object.keys(D.photos));
  return `<ul class="nights">${[...list].reverse().slice(0,4).map(x=>
    `<li class="${cams.has(x.date+'|'+x.billing)?'cam':''}"><b>${fmt(x.date)}</b><span class="v">${label ? esc(label(x))+' · ' : ''}${esc(x.venue)}${label ? '' : ', '+esc(x.city.split(',')[0])}${x.role==='o'&&!label?' · opening':''}</span></li>`).join('')}
    ${list.length>4 ? `<li>+ ${list.length-4} more</li>` : ''}</ul>`;
}
const list = a => a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function play(a, t) { render(identify(a, t)); }

// demo panel
const PICKS = [
  ['Social Distortion','Ring of Fire'],
  ['Echo & the Bunnymen','The Killing Moon'],
  ['Depeche Mode','Everything Counts (Remastered 2006)'],
  ['Garbage','Only Happy When It Rains'],
  ['Gary Numan','The Fall'],
  ['Blancmange','Blind Vision - Single Version'],
  ['The Cure','A Forest'],
  ['Depeche Mode','Barrel of a Gun'],
  ['David Bowie',"Let's Dance - 2018 Remaster"],
  ['The Rolling Stones','Paint It Black'],
  ['Fleetwood Mac','Dreams'],
];
function setupPanel() {
  $('chips').innerHTML = PICKS.map((p,i)=>`<button data-i="${i}">${esc(p[1].replace(/\s*[\(\-].*$/,''))}</button>`).join('');
  $('chips').onclick = e => { const b=e.target.closest('button'); if(!b) return; const p=PICKS[b.dataset.i];
    $('inArtist').value=p[0]; $('inTitle').value=p[1]; play(p[0],p[1]); };
  $('go').onclick = () => play($('inArtist').value, $('inTitle').value);
  $('toggle').onclick = () => $('panel').classList.toggle('open');
  $('search').oninput = e => {
    const q = e.target.value.toLowerCase().trim();
    if (q.length<2) { $('res').innerHTML=''; return; }
    const hits = D.songs.filter(s => (s.n+' '+D.artists[s.a]?.n).toLowerCase().includes(q)).slice(0,8);
    $('res').innerHTML = hits.map(s=>`<button data-a="${esc(D.artists[s.a]?.n||s.a)}" data-t="${esc(s.n)}">${esc(s.n)} <span>· ${esc(D.artists[s.a]?.n||s.a)} · ${s.d.length}×</span></button>`).join('');
  };
  $('res').onclick = e => { const b=e.target.closest('button'); if(b) play(b.dataset.a, b.dataset.t); };
}

function fit() {
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  $('stage').style.transform = `scale(${s})`;
  $('fit').style.width = innerWidth+'px'; $('fit').style.height = innerHeight+'px';
}
addEventListener('resize', fit); fit();

fetch('data.json').then(r=>r.json()).then(d => { D=d; index(); setupPanel(); play('Social Distortion','Ring of Fire'); });
</script>
</body>
</html>
