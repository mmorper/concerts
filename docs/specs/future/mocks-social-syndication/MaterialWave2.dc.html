<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #6d28d9; } a:hover { color: #5b21b6; }
  </style>
</helmet>

<div style="width: 1080px; height: 1350px; background: #f2ece1; position: relative; overflow: hidden; font-family: 'Source Sans 3', system-ui, sans-serif;">

  <div style="position: absolute; inset: 0; opacity: 0.05; background-image: repeating-linear-gradient(0deg, #1c1a24 0px, #1c1a24 1px, transparent 1px, transparent 4px);"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 84px 76px 80px 76px; box-sizing: border-box;">

    <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 96px; line-height: 1.06; letter-spacing: -0.025em; color: #1c1a24; text-wrap: pretty;">
      I found the same song in my ticket stubs twice.
    </div>

    <div style="position: relative; height: 440px;">

      <div style="position: absolute; right: 8px; top: 74px; width: 700px; transform: rotate(3.4deg); background: #f7f2e8; border: 2px solid #3a3540; box-shadow: 8px 10px 0 rgba(28,26,36,0.10); padding: 26px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 22px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #9a9082;">Pacific Amphitheatre · 2026</span>
        <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 62px; line-height: 1.02; color: #b3a897;">— — — — — —</span>
      </div>

      <div style="position: absolute; left: 0; top: 0; width: 760px; transform: rotate(-2.1deg); background: #fdfaf4; border: 3px solid #1c1a24; box-shadow: 12px 14px 0 rgba(28,26,36,0.16); display: flex; align-items: stretch;">
        <div style="width: 96px; border-right: 2px dashed #b9b0a0; background: #f0e9dc; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 18px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #8a8172; transform: rotate(-90deg); white-space: nowrap;">Admit One</span>
        </div>
        <div style="flex-grow: 1; padding: 30px 34px; display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 22px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #8a8172;">Irvine Meadows · July 1987</span>
          <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 70px; line-height: 1.02; color: #1c1a24;">Duran Duran</span>
          <span style="font-size: 26px; font-weight: 500; font-style: italic; color: #4a4454;">Notorious</span>
        </div>
      </div>

      <div style="position: absolute; right: 42px; bottom: -6px; transform: rotate(-6deg); display: flex; align-items: center; gap: 12px;">
        <span style="font-family: 'Caveat', 'Segoe Script', cursive; font-size: 58px; color: #6d28d9;">same song&nbsp;&nbsp;&rarr;</span>
      </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 34px;">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 50px; line-height: 1.2; color: #3a3444; text-wrap: pretty;">
        Thirty-nine years apart — and the second time, the man playing it wasn't in the band.
      </div>

      <div style="display: flex; align-items: center; gap: 20px;">
        <span style="width: 64px; height: 4px; background: #6d28d9;"></span>
        <span style="font-size: 34px; font-weight: 600; color: #5b5346;">Were you at either one?</span>
      </div>

      <div style="display: flex; justify-content: flex-end;">
        <span style="font-size: 26px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #a39a8b;">Morperhaus</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
