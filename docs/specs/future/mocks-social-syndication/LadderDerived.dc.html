<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c4b5fd; } a:hover { color: #ffffff; }
  </style>
</helmet>

<!-- LANE 1 · TIER 3 (derived) — DRAWN AT NATIVE SIZE.
     The previous cut authored this in a 936x936 viewBox and rendered it at
     780, throwing away 17% of the linework for nothing. Derived artwork is the
     one tier with no source file and therefore no ceiling: it is generated to
     whatever frame we ask for, so it should be authored AT the frame. The
     viewBox is now 1080x820, 1:1 with the band.

     Bars are real per-year show counts, 1984-2026. 1987 and 2026 are lit and
     the span between them is the story. -->
<div style="width: 1080px; height: 1350px; background: #14111f; position: relative; overflow: hidden; font-family: 'Source Sans 3', system-ui, sans-serif;">

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">

    <div style="width: 1080px; height: 820px; background: #1a1529; flex-shrink: 0;">
      <svg viewBox="0 0 1080 820" width="1080" height="820" style="display: block;">

        <sc-for list="{{bars}}" as="bar" hint-placeholder-count="43">
          <rect x="{{bar.x}}" y="{{bar.y}}" width="15" height="{{bar.h}}" fill="#2a2340" rx="2"></rect>
        </sc-for>

        <text x="540" y="318" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="300" fill="#c4b5fd">39</text>
        <text x="540" y="386" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="52" fill="#7c6ba8">years apart</text>

        <line x1="92" y1="486" x2="988" y2="486" stroke="#5b4598" stroke-width="4" stroke-dasharray="3 14" stroke-linecap="round"></line>
        <circle cx="92" cy="486" r="18" fill="#c4b5fd"></circle>
        <circle cx="988" cy="486" r="18" fill="#c4b5fd"></circle>

        <text x="92" y="440" text-anchor="start" font-family="'Source Sans 3', system-ui, sans-serif" font-size="44" font-weight="600" fill="#f5f2ff">1987</text>
        <text x="988" y="440" text-anchor="end" font-family="'Source Sans 3', system-ui, sans-serif" font-size="44" font-weight="600" fill="#f5f2ff">2026</text>

      </svg>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 24px; padding: 36px 72px 72px 72px; box-sizing: border-box;">

      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="width: 56px; height: 5px; background: #7c3aed; flex-shrink: 0;"></span>
        <span style="font-size: 34px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #ffffff; text-wrap: pretty;">Nile Rodgers · Duran Duran</span>
      </div>

      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 72px; line-height: 1.06; letter-spacing: -0.025em; color: #ffffff; text-wrap: pretty;">
        I heard the same song twice, thirty-nine years apart.
      </div>

      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px;">
        <span style="font-size: 29px; font-weight: 500; line-height: 1.42; color: #8a80ab;">&ldquo;Notorious&rdquo;<br>Irvine Meadows · July 1987<br>Pacific Amphitheatre · July 2026</span>
        <div style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0;">
          <span style="font-size: 26px; font-weight: 600; line-height: 1.1; letter-spacing: 0.01em; color: #5d5480;">concerts.</span>
          <span style="font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: 0.01em; color: #8a80ab;">morperhaus</span>
          <span style="font-size: 26px; font-weight: 600; line-height: 1.1; letter-spacing: 0.01em; color: #5d5480;">.org</span>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    // Real per-year show counts, 1984-2026, laid out across the full 1080 band.
    const counts = [4,8,4,3,7,1,6,6,1,3,0,4,0,1,2,2,1,1,1,4,0,4,3,3,6,2,3,3,6,6,6,6,6,12,8,9,0,2,14,11,6,4,5];
    const baseline = 772;
    const perShow = 17.2;
    const bars = counts.map((n, i) => {
      const h = n * perShow;
      return { x: 62 + i * 22.3, y: baseline - h, h: h };
    });
    return { bars: bars };
  }
}
</script>
</body>
</html>
