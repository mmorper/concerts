<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7dd3fc; } a:hover { color: #ffffff; }
  </style>
</helmet>

<!-- LANE 4 · ON THIS DAY — SINGLE SHOW, DATE-FORWARD.
     The date is the masthead, not the headline. That is what separates the two
     streams at a glance in a feed: a liner note leads with a sentence, an On
     This Day leads with a date. 117 of the 145 covered days have exactly one
     show, so this is the common case by a wide margin. -->
<div style="width: 1080px; height: 1350px; background: #14111f; position: relative; overflow: hidden; font-family: 'Source Sans 3', system-ui, sans-serif;">

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">

    <!-- MASTHEAD · the stream's signature -->
    <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 3px solid #0ea5e9; margin: 72px 72px 0 72px; padding-bottom: 22px; flex-shrink: 0;">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 96px; line-height: 0.9; letter-spacing: -0.03em; color: #ffffff;">June 21</span>
      <span style="font-size: 30px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #0ea5e9;">On this day</span>
    </div>

    <div style="width: 1080px; height: 580px; margin-top: 40px; position: relative; overflow: hidden; background: #241f38; flex-shrink: 0;">
      <div style="position: absolute; inset: 0; background:
        radial-gradient(46% 62% at 50% 44%, #4b5d78 0%, rgba(75,93,120,0) 74%),
        linear-gradient(155deg, #2a3348 0%, #171b28 100%);"></div>
      <span style="position: absolute; left: 30px; top: 30px; font-size: 19px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.26); padding: 6px 11px;">Tier 2 · venue</span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 24px; padding: 36px 72px 72px 72px; box-sizing: border-box;">

      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="width: 56px; height: 5px; background: #0ea5e9; flex-shrink: 0;"></span>
        <span style="font-size: 34px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #ffffff;">Jimmy Buffett</span>
      </div>

      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 60px; line-height: 1.05; letter-spacing: -0.025em; color: #ffffff; text-wrap: pretty;">
        Thirty-five years ago tonight. The first of three at the same amphitheatre.
      </div>

      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 32px;">
        <span style="font-size: 29px; font-weight: 500; line-height: 1.42; color: #7e8aa4;">Irvine Meadows<br>Irvine, California<br>21 June 1991</span>
        <div style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0;">
          <span style="font-size: 26px; font-weight: 600; line-height: 1.1; letter-spacing: 0.01em; color: #55607a;">concerts.</span>
          <span style="font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: 0.01em; color: #7e8aa4;">morperhaus</span>
          <span style="font-size: 26px; font-weight: 600; line-height: 1.1; letter-spacing: 0.01em; color: #55607a;">.org</span>
        </div>
      </div>

    </div>
  </div>
</div>
