<svg viewBox="0 0 1280 670" role="img" aria-label="Architecture of the Morperhaus Concert Archives. On the left, GitHub: pull requests pass six CI gates, and scheduled jobs pull a Google Sheet and the Claude API to commit data and prose. All of it converges on the main branch. Two arrows cross into Cloudflare on the right, where Pages serves the site at its public paths and four Workers run at the edge, backed by KV, a Durable Object and Analytics Engine. One dashed red arrow bypasses the pipeline entirely: a kill switch flipped by hand, with no deploy." xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ar-gh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--gh, #4338ca)"/>
    </marker>
    <marker id="ar-cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cf, #b45309)"/>
    </marker>
    <marker id="ar-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--stop, #991b1b)"/>
    </marker>
  </defs>

  <!-- ============ zone labels + seam ============ -->
  <g transform="translate(40, 26) scale(0.9167)"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="currentColor"/></g>
  <text x="72" y="43" font-size="17" font-weight="700" letter-spacing="0.4" fill="var(--gh, #4338ca)">GitHub</text>
  <g transform="translate(666, 24) scale(1.1667)"><path d="M16.5088 16.8447c.1475-.5068.0908-.9707-.1553-1.3154-.2246-.3164-.6045-.499-1.0615-.5205l-8.6592-.1123a.1559.1559 0 0 1-.1333-.0713c-.0283-.042-.0351-.0986-.021-.1553.0278-.084.1123-.1484.2036-.1562l8.7359-.1123c1.0351-.0489 2.1601-.8868 2.5537-1.9136l.499-1.3013c.0215-.0561.0293-.1128.0147-.168-.5625-2.5463-2.835-4.4453-5.5499-4.4453-2.5039 0-4.6284 1.6177-5.3876 3.8614-.4927-.3658-1.1187-.5625-1.794-.499-1.2026.119-2.1665 1.083-2.2861 2.2856-.0283.31-.0069.6128.0635.894C1.5683 13.171 0 14.7754 0 16.752c0 .1748.0142.3515.0352.5273.0141.083.0844.1475.1689.1475h15.9814c.0909 0 .1758-.0645.2032-.1553l.12-.4268zm2.7568-5.5634c-.0771 0-.1611 0-.2383.0112-.0566 0-.1054.0415-.127.0976l-.3378 1.1744c-.1475.5068-.0918.9707.1543 1.3164.2256.3164.6055.498 1.0625.5195l1.8437.1133c.0557 0 .1055.0263.1329.0703.0283.043.0351.1074.0214.1562-.0283.084-.1132.1485-.204.1553l-1.921.1123c-1.041.0488-2.1582.8867-2.5527 1.914l-.1406.3585c-.0283.0713.0215.1416.0986.1416h6.5977c.0771 0 .1474-.0489.169-.126.1122-.4082.1757-.837.1757-1.2803 0-2.6025-2.125-4.727-4.7344-4.727" fill="#F38020"/></g>
  <text x="704" y="43" font-size="17" font-weight="700" letter-spacing="0.4" fill="var(--cf, #b45309)">Cloudflare</text>
  <line x1="620" y1="58" x2="620" y2="650" stroke="var(--muted, #78716c)" stroke-width="1.6" stroke-dasharray="7 7" opacity="0.55"/>
  <rect x="535" y="66" width="170" height="28" rx="14" fill="var(--surface, #ffffff)" stroke="var(--rule, #ddd9d5)"/>
  <text x="620" y="85" font-size="12" text-anchor="middle" fill="var(--muted, #78716c)">one API token crosses</text>

  <!-- ============ main spine ============ -->
  <rect x="470" y="100" width="100" height="430" rx="8" fill="var(--gh, #4338ca)"/>
  <text x="520" y="152" font-size="27" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" fill="var(--on-accent, #ffffff)">main</text>
  <text x="520" y="176" font-size="11" text-anchor="middle" fill="var(--on-accent, #ffffff)" opacity="0.82">every change</text>
  <text x="520" y="190" font-size="11" text-anchor="middle" fill="var(--on-accent, #ffffff)" opacity="0.82">lands here</text>

  <!-- ============ row 1 — pull request ============ -->
  <rect x="40" y="110" width="136" height="64" rx="6" fill="var(--surface, #ffffff)" stroke="var(--gh, #4338ca)" stroke-width="1.5"/>
  <text x="56" y="136" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">Pull request</text>
  <text x="56" y="154" font-size="10.5" fill="var(--muted, #78716c)">human or Dependabot</text>

  <rect x="208" y="110" width="192" height="64" rx="6" fill="var(--surface, #ffffff)" stroke="var(--gh, #4338ca)" stroke-width="1.5"/>
  <text x="224" y="134" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">6 CI gates</text>
  <text x="224" y="152" font-size="11" fill="var(--muted, #78716c)">typecheck · unit tests · build</text>
  <text x="224" y="166" font-size="11" fill="var(--muted, #78716c)">every scene in a real browser</text>

  <line x1="180" y1="142" x2="200" y2="142" stroke="var(--gh, #4338ca)" stroke-width="1.6" marker-end="url(#ar-gh)"/>
  <line x1="404" y1="142" x2="462" y2="142" stroke="var(--gh, #4338ca)" stroke-width="1.6" marker-end="url(#ar-gh)"/>
  <text x="433" y="132" font-size="11" text-anchor="middle" fill="var(--muted, #78716c)">green only</text>

  <!-- ============ row 2 — data ============ -->
  <rect x="40" y="214" width="136" height="64" rx="6" fill="none" stroke="var(--muted, #78716c)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="56" y="240" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">Google Sheet</text>
  <text x="56" y="258" font-size="10.5" fill="var(--muted, #78716c)">the raw data</text>

  <rect x="208" y="214" width="192" height="64" rx="6" fill="var(--surface, #ffffff)" stroke="var(--gh, #4338ca)" stroke-width="1.5"/>
  <text x="224" y="238" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">Data refresh</text>
  <text x="224" y="256" font-size="11" fill="var(--muted, #78716c)">weekly — sheet + music APIs</text>
  <text x="224" y="270" font-size="11" fill="var(--muted, #78716c)">geocoding, setlists, photos</text>

  <line x1="180" y1="246" x2="200" y2="246" stroke="var(--gh, #4338ca)" stroke-width="1.6" marker-end="url(#ar-gh)"/>
  <line x1="404" y1="246" x2="462" y2="246" stroke="var(--gh, #4338ca)" stroke-width="1.6" marker-end="url(#ar-gh)"/>
  <text x="433" y="236" font-size="11" text-anchor="middle" fill="var(--muted, #78716c)">commits data</text>

  <!-- ============ row 3 — prose ============ -->
  <rect x="40" y="318" width="136" height="64" rx="6" fill="none" stroke="var(--muted, #78716c)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="56" y="344" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">Claude API</text>
  <text x="56" y="362" font-size="10.5" fill="var(--muted, #78716c)">writes the prose</text>

  <rect x="208" y="318" width="192" height="64" rx="6" fill="var(--surface, #ffffff)" stroke="var(--gh, #4338ca)" stroke-width="1.5"/>
  <text x="224" y="342" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">Prose jobs</text>
  <text x="224" y="360" font-size="11" fill="var(--muted, #78716c)">liner notes — weekly</text>
  <text x="224" y="374" font-size="11" fill="var(--muted, #78716c)">On This Day — daily</text>

  <line x1="180" y1="350" x2="200" y2="350" stroke="var(--gh, #4338ca)" stroke-width="1.6" marker-end="url(#ar-gh)"/>
  <line x1="404" y1="350" x2="462" y2="350" stroke="var(--gh, #4338ca)" stroke-width="1.6" marker-end="url(#ar-gh)"/>
  <text x="433" y="340" font-size="11" text-anchor="middle" fill="var(--muted, #78716c)">commits prose</text>

  <!-- ============ row 4 — syndication, the one outbound path ============ -->
  <rect x="40" y="430" width="136" height="92" rx="6" fill="none" stroke="var(--muted, #78716c)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="56" y="454" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">Social</text>
  <text x="56" y="472" font-size="10.5" fill="var(--muted, #78716c)">Bluesky · Mastodon</text>
  <text x="56" y="493" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="var(--muted, #78716c)" opacity="0.85">COMING SOON</text>
  <text x="56" y="508" font-size="10.5" fill="var(--muted, #78716c)" opacity="0.85">X · Instagram</text>

  <rect x="208" y="430" width="192" height="64" rx="6" fill="var(--surface, #ffffff)" stroke="var(--gh, #4338ca)" stroke-width="1.5"/>
  <text x="224" y="454" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">Syndicate</text>
  <text x="224" y="472" font-size="11" fill="var(--muted, #78716c)">daily — posts new notes</text>
  <text x="224" y="486" font-size="11" fill="var(--muted, #78716c)">committed ledger, never twice</text>

  <line x1="462" y1="462" x2="404" y2="462" stroke="var(--gh, #4338ca)" stroke-width="1.6" marker-end="url(#ar-gh)"/>
  <text x="433" y="452" font-size="11" text-anchor="middle" fill="var(--muted, #78716c)">reads notes</text>
  <line x1="204" y1="462" x2="182" y2="462" stroke="var(--gh, #4338ca)" stroke-width="1.6" marker-end="url(#ar-gh)"/>
  <text x="193" y="452" font-size="10" text-anchor="middle" fill="var(--muted, #78716c)">posts</text>

  <!-- ============ the two crossings ============ -->
  <line x1="574" y1="158" x2="660" y2="158" stroke="var(--cf, #b45309)" stroke-width="2" marker-end="url(#ar-cf)"/>
  <text x="617" y="127" font-size="11.5" text-anchor="middle" fill="var(--cf, #b45309)" font-weight="600">publishes</text>
  <text x="617" y="140" font-size="11.5" text-anchor="middle" fill="var(--cf, #b45309)" font-weight="600">the site</text>

  <line x1="574" y1="300" x2="660" y2="300" stroke="var(--cf, #b45309)" stroke-width="2" marker-end="url(#ar-cf)"/>
  <text x="617" y="269" font-size="11.5" text-anchor="middle" fill="var(--cf, #b45309)" font-weight="600">deploys</text>
  <text x="617" y="282" font-size="11.5" text-anchor="middle" fill="var(--cf, #b45309)" font-weight="600">if changed</text>

  <!-- ============ Cloudflare — Pages ============ -->
  <rect x="666" y="112" width="574" height="70" rx="6" fill="var(--surface, #ffffff)" stroke="var(--cf, #b45309)" stroke-width="1.5"/>
  <text x="684" y="136" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">Pages</text>
  <text x="684" y="154" font-size="11" fill="var(--muted, #78716c)">the built site on the CDN — concerts.morperhaus.org</text>
  <text x="684" y="171" font-size="11" fill="var(--cf, #b45309)">/how-it-works · /liner-notes · /liner-notes/&lt;slug&gt; · /whats-playing · /ask</text>

  <!-- ============ Cloudflare — Workers ============ -->
  <rect x="666" y="222" width="574" height="298" rx="10" fill="none" stroke="var(--cf, #b45309)" stroke-width="1.3" stroke-dasharray="5 5" opacity="0.7"/>
  <text x="684" y="248" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="var(--cf, #b45309)">FOUR WORKERS</text>

  <rect x="684" y="272" width="252" height="62" rx="6" fill="var(--surface, #ffffff)" stroke="var(--cf, #b45309)" stroke-width="1.5"/>
  <text x="700" y="296" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">meta-injector</text>
  <text x="700" y="313" font-size="11" fill="var(--cf, #b45309)">/*  — fronts every request</text>
  <text x="700" y="327" font-size="11" fill="var(--muted, #78716c)">real meta tags for crawlers</text>

  <rect x="684" y="352" width="252" height="62" rx="6" fill="var(--surface, #ffffff)" stroke="var(--cf, #b45309)" stroke-width="1.5"/>
  <text x="700" y="376" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">mcp-server</text>
  <text x="700" y="393" font-size="11" fill="var(--cf, #b45309)">/mcp*</text>
  <text x="700" y="407" font-size="11" fill="var(--muted, #78716c)">lets Claude query the archive</text>

  <rect x="684" y="432" width="252" height="62" rx="6" fill="var(--surface, #ffffff)" stroke="var(--cf, #b45309)" stroke-width="1.5"/>
  <text x="700" y="456" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">ask-chat</text>
  <text x="700" y="473" font-size="11" fill="var(--cf, #b45309)">/api/ask*</text>
  <text x="700" y="487" font-size="11" fill="var(--muted, #78716c)">in-app chat · limits · spend cap</text>

  <rect x="962" y="272" width="260" height="62" rx="6" fill="var(--surface, #ffffff)" stroke="var(--cf, #b45309)" stroke-width="1.5"/>
  <text x="978" y="296" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">dashboard-refresh</text>
  <text x="978" y="313" font-size="11" fill="var(--cf, #b45309)">cron 06:00 — no public route</text>
  <text x="978" y="327" font-size="11" fill="var(--muted, #78716c)">builds the ops snapshot</text>

  <rect x="962" y="352" width="260" height="132" rx="6" fill="var(--surface, #ffffff)" stroke="var(--rule, #ddd9d5)" stroke-width="1.5"/>
  <text x="978" y="378" font-size="14" font-weight="600" fill="var(--ink, #1c1917)">Edge state</text>
  <text x="978" y="406" font-size="11" fill="var(--muted, #78716c)">KV — flags and snapshots</text>
  <text x="978" y="430" font-size="11" fill="var(--muted, #78716c)">Durable Object — spend counter</text>
  <text x="978" y="454" font-size="11" fill="var(--muted, #78716c)">Analytics Engine — every turn</text>

  <!-- ============ the one bypass ============ -->
  <rect x="962" y="572" width="260" height="48" rx="6" fill="none" stroke="var(--stop, #991b1b)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="978" y="594" font-size="13.5" font-weight="600" fill="var(--stop, #991b1b)">Mike, from a phone</text>
  <text x="978" y="611" font-size="11" fill="var(--muted, #78716c)">kill switch · spend cap</text>
  <line x1="1180" y1="570" x2="1180" y2="490" stroke="var(--stop, #991b1b)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-stop)"/>
  <text x="1168" y="536" font-size="11" text-anchor="end" fill="var(--stop, #991b1b)" font-weight="600">no deploy</text>

  <!-- ============ legend ============ -->
  <rect x="40" y="562" width="14" height="14" rx="3" fill="var(--gh, #4338ca)"/>
  <text x="66" y="574" font-size="11.5" fill="var(--muted, #78716c)">GitHub — built, tested, committed</text>
  <rect x="40" y="590" width="14" height="14" rx="3" fill="var(--cf, #b45309)"/>
  <text x="66" y="602" font-size="11.5" fill="var(--muted, #78716c)">Cloudflare — deployed and serving</text>
  <line x1="40" y1="625" x2="54" y2="625" stroke="var(--stop, #991b1b)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="66" y="630" font-size="11.5" fill="var(--muted, #78716c)">manual override — bypasses the pipeline</text>
</svg>
