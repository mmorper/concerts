<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="favBg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e1065;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>

    <!-- Hero node glow -->
    <radialGradient id="favGlow7" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="url(#favBg7)"/>

  <!-- Asymmetric web connections -->
  <line x1="18" y1="13" x2="11" y2="8" stroke="#a855f7" stroke-width="2" opacity="0.65"/>
  <line x1="18" y1="13" x2="26" y2="10" stroke="#a855f7" stroke-width="2.5" opacity="0.7"/>
  <line x1="18" y1="13" x2="25" y2="20" stroke="#a855f7" stroke-width="2" opacity="0.65"/>
  <line x1="18" y1="13" x2="14" y2="23" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <line x1="18" y1="13" x2="7" y2="18" stroke="#a855f7" stroke-width="1.8" opacity="0.55"/>

  <!-- Secondary interconnection -->
  <line x1="26" y1="10" x2="25" y2="20" stroke="#7c3aed" stroke-width="1.5" opacity="0.35"/>

  <!-- Peripheral nodes (organic sizes) -->
  <circle cx="11" cy="8" r="2.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="26" cy="10" r="3.5" fill="#6366f1" opacity="0.95"/>
  <circle cx="25" cy="20" r="3" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="14" cy="23" r="3" fill="#7c3aed" opacity="0.85"/>
  <circle cx="7" cy="18" r="2" fill="#7c3aed" opacity="0.75"/>

  <!-- Central hero node (off-center) -->
  <circle cx="18" cy="13" r="6" fill="url(#favGlow7)"/>
  <circle cx="18" cy="13" r="6" fill="#ffffff" opacity="0.35"/>
  <circle cx="18" cy="13" r="4" fill="#ffffff" opacity="0.2"/>
</svg>
