<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>

    <!-- Central hero node — luminous lavender bloom (Liquid Glass "C" treatment) -->
    <radialGradient id="nodeGlow2" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#f5f3ff;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#c4b5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" fill="url(#bgGradient2)"/>

  <!-- Connection lines — far ends tucked just inside each node edge so they
       connect cleanly without showing through the (semi-transparent) nodes. -->
  <line x1="90" y1="90" x2="50" y2="50" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <line x1="90" y1="90" x2="130" y2="50" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <line x1="90" y1="90" x2="131" y2="131" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <line x1="90" y1="90" x2="49" y2="131" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <line x1="90" y1="90" x2="90" y2="39" stroke="#a855f7" stroke-width="2.5" opacity="0.6"/>
  <line x1="90" y1="90" x2="141" y2="90" stroke="#a855f7" stroke-width="2.5" opacity="0.6"/>

  <!-- Secondary connections (tucked under both node edges) -->
  <line x1="52" y1="43" x2="81" y2="33" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
  <line x1="137" y1="52" x2="147" y2="81" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>

  <!-- Peripheral nodes -->
  <circle cx="90" cy="30" r="10" fill="#6366f1" opacity="0.95"/>
  <circle cx="150" cy="90" r="10" fill="#6366f1" opacity="0.95"/>
  <circle cx="135" cy="135" r="7" fill="#7c3aed" opacity="0.8"/>
  <circle cx="45" cy="135" r="7" fill="#7c3aed" opacity="0.8"/>
  <circle cx="45" cy="45" r="8" fill="#8b5cf6" opacity="0.85"/>
  <circle cx="135" cy="45" r="8" fill="#8b5cf6" opacity="0.85"/>

  <!-- Central hero node (bloom) -->
  <circle cx="90" cy="90" r="32" fill="url(#nodeGlow2)"/>
</svg>
