name = "concerts-dashboard-refresh"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# The other three Workers pin this; without it wrangler resolves the account by calling
# /memberships, which a least-privilege CI token has no reason to be allowed to read —
# and that's exactly how the first automated deploy failed (Authentication error 10000).
# Pinning it removes the lookup instead of widening the token.
account_id = "6db8591bbcba4588ae4ef9c3839cd209"

# Daily refresh at 06:00 UTC.
[triggers]
crons = ["0 6 * * *"]

# Shared with the Concerts site's CONCERTS_DASHBOARD binding — same namespace.
# Create it once:  npx wrangler kv namespace create CONCERTS_DASHBOARD
# then paste the id here AND bind the same id on the Pages project (functions/dashboard/data.ts).
[[kv_namespaces]]
binding = "CONCERTS_DASHBOARD"
id = "502609752daf419e9b7e1727329f2485"

[vars]
# Same Cloudflare account as the rest of the project.
CF_ACCOUNT_ID = "6db8591bbcba4588ae4ef9c3839cd209"
# Monthly Anthropic spend cap (USD) the trend draws a line at. Mirrors ask-chat ASK_MONTHLY_USD ($25).
CAP_USD = "25"
# Phase 3 GA — numeric GA4 property id for G-VKSC8MCN5N (DISCOVER(1), owner console task #170).
# Leave unset to keep the GA source `not_configured` (the rest of the snapshot is unaffected).
# GA_PROPERTY = "<CONCERTS_GA4_NUMERIC_PROPERTY_ID>"
# Phase 5 Archive Health — where the generated public/data/*.json are served (no trailing slash).
DATA_BASE_URL = "https://concerts.morperhaus.org/data"

# Secrets — set with `npx wrangler secret put <NAME>` (never committed):
#   CF_API_TOKEN          Account token with Analytics:Read + Account Analytics
#                         (covers BOTH the GraphQL traffic query AND the ask_turns Analytics Engine SQL API).
#   REFRESH_KEY           Optional — enables GET /?key=<REFRESH_KEY> to seed/trigger a refresh out of band.
#   GA_SA_KEY_JSON        Phase 3 GA — the GA service-account key JSON (client_email + private_key +
#                         token_uri). Same SA/DWD as the Pitch dashboard; account-level GA Viewer.
#   GA_IMPERSONATE_SUBJECT Phase 3 GA — optional DWD subject the SA impersonates (a GA-Viewer user).
