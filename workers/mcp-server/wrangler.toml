# Cloudflare Worker Configuration — Morperhaus Concert Archive MCP Server
# Spec: docs/specs/future/global-mcp-server.md (Addendum 2026-05-17: Agentic Layer)
# Deploys to: concerts.morperhaus.org/mcp* (more specific than meta-injector's /*)

name = "morperhaus-mcp"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

account_id = "6db8591bbcba4588ae4ef9c3839cd209"

[[routes]]
pattern = "concerts.morperhaus.org/mcp*"
zone_name = "morperhaus.org"

# OAuth-discovery paths live at the zone root, NOT under /mcp, so they need their own routes.
# Without them they fall through to meta-injector's /* → the Pages SPA catch-all, which answers
# 200 + index.html to any GET — and a client reads that as "an authorization server exists here."
# These routes exist so src/index.ts can answer 404 (= no auth on this server). More-specific
# patterns win over meta-injector's /*, same as /mcp* already does.
[[routes]]
pattern = "concerts.morperhaus.org/.well-known/oauth*"
zone_name = "morperhaus.org"

[[routes]]
pattern = "concerts.morperhaus.org/register"
zone_name = "morperhaus.org"

[vars]
DATA_BASE_URL = "https://concerts.morperhaus.org/data"

# `agents` lazily imports the Vercel `ai` SDK from its MCP *client* path (dead code for a
# server). Alias it to a local no-op stub so esbuild doesn't try to bundle the whole SDK.
# See src/ai-stub.ts.
[alias]
ai = "./src/ai-stub.ts"

# Bundle prompt files as text so they can be imported (the `query` tool's system prompt
# lives in prompts/query.md — kept separate from code so prompt-only edits stay small).
# fallthrough keeps wrangler's default Text rules (.txt/.html/.sql) active alongside this one.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# KV namespace for `query` tool daily-cap enforcement (Addendum §Decision: runtime `query` escape hatch).
# Stores per-day {tokens, calls}; pre-flight read refuses if over cap, post-flight write via ctx.waitUntil.
# Create the namespace once with:
#   npx wrangler kv namespace create MCP_QUERY_USAGE
# then paste the returned `id` below (and replace this comment).
[[kv_namespaces]]
binding = "MCP_QUERY_USAGE"
id = "8aee948db1eb48c6ad9bbed2c4a43fa8"

# Analytics Engine — per-tool-call telemetry (Phase 4 / #174). One row per tool invocation
# (blob1=day, blob2=tool, blob3=source, blob4=outcome; double1=1). The dataset is created on the
# first writeDataPoint after deploy — there is NO namespace to pre-create. The operator dashboard's
# refresh Worker reads it via the account SQL API:
#   SELECT blob1 AS day, blob2 AS tool, SUM(_sample_interval) AS n FROM mcp_queries
#   WHERE timestamp >= NOW() - INTERVAL '30' DAY GROUP BY day, tool
# NOTE: not retroactive — external tool-call history only accrues once this is deployed.
[[analytics_engine_datasets]]
binding = "MCP_ANALYTICS"
dataset = "mcp_queries"

# McpAgent is a Durable Object. `serve("/mcp")` resolves it through the default
# MCP_OBJECT binding; the Agents SDK requires SQLite-backed DO storage (new_sqlite_classes).
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "MorperhausMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MorperhausMcp"]

# Anthropic API key for the `query` tool is stored as a Wrangler secret, NOT in this file:
#   cd workers/mcp-server && npx wrangler secret put ANTHROPIC_API_KEY

[build]
command = ""
