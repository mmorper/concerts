name: Ask-chat CI

# Typecheck + tests for the Ask-the-Archive chat Worker (incl. the Phase 2 operator-control
# admin API). Runs only when the worker (or its sibling mcp-server, which it imports tool fns
# from) changes, so it's a fast PR gate without touching the rest of the repo. The worker is its
# own npm package with its own vitest config — it doesn't run as part of the root test suite, so
# this is its automated guard.

on:
  push:
    branches: [main]
    paths:
      - 'workers/ask-chat/**'
      - 'workers/mcp-server/**'
      - '.github/workflows/ask-chat-ci.yml'
  pull_request:
    paths:
      - 'workers/ask-chat/**'
      - 'workers/mcp-server/**'
      - '.github/workflows/ask-chat-ci.yml'

concurrency:
  group: ask-chat-ci-${{ github.ref }}
  # PR runs cancel on supersede; main-branch runs don't, since they may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            workers/mcp-server/package-lock.json
            workers/ask-chat/package-lock.json

      # The ask-chat typecheck reuses the mcp-server's tool fns (../mcp-server/src), so its
      # type deps must be present. Both packages have committed lock files (#457) → npm ci.
      - name: Install mcp-server dependencies (sibling, for shared types)
        run: npm ci
        working-directory: workers/mcp-server

      - name: Install ask-chat dependencies
        run: npm ci
        working-directory: workers/ask-chat

      - name: Typecheck
        run: npm run typecheck
        working-directory: workers/ask-chat

      - name: Test
        run: npm test
        working-directory: workers/ask-chat

  # See mcp-ci.yml's deploy job for the full rationale: the site auto-deploys on push, the
  # Workers did not, and `/release` only covered meta-injector — so this Worker drifted to
  # 2026-06-22 code while CI stayed green. Note the path filter above also fires on sibling
  # mcp-server changes (shared tool fns), which is intended: a shared-code change that this
  # Worker's tests cover should also reach its running copy.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ask-chat-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/ask-chat
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            workers/mcp-server/package-lock.json
            workers/ask-chat/package-lock.json

      # Same reason as the test job: this Worker imports the mcp-server's tool fns, and esbuild
      # resolves those files' own imports (zod) from workers/mcp-server/node_modules. Installing
      # only ask-chat's deps bundles fine locally — where the sibling is already installed — and
      # fails in CI with `Could not resolve "zod"`.
      - name: Install mcp-server dependencies (sibling, for bundling)
        run: npm ci
        working-directory: workers/mcp-server

      - name: Install ask-chat dependencies
        run: npm ci

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # See mcp-ci.yml: "uploaded" is not "answers requests". /api/ask/status is the only safe
      # probe here — an unauthenticated GET that returns the operator mode. /session needs a
      # Turnstile token and /chat spends Anthropic credit, so neither belongs in CI.
      - name: Smoke test the live endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            body=$(curl -sS --max-time 20 https://concerts.morperhaus.org/api/ask/status || true)
            case "$body" in *'"mode"'*) echo "status -> $body"; ok=1; break ;; esac
            echo "attempt $i: $body"
            sleep 6
          done
          if [ "${ok:-}" != 1 ]; then
            echo "::error::/api/ask/status did not return a mode"
            exit 1
          fi
