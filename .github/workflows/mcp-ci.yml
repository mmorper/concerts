name: MCP CI

# Typecheck + tests for the MCP server Worker. Runs only when the worker (or this
# workflow) changes, so it's a fast gate on PRs without touching the rest of the repo.
# The worker is its own npm package with its own vitest config — these don't run as
# part of the root test suite, so this is the automated guard for it.

on:
  push:
    branches: [main]
    paths:
      - 'workers/mcp-server/**'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'workers/mcp-server/**'
      - '.github/workflows/mcp-ci.yml'

concurrency:
  group: mcp-ci-${{ github.ref }}
  # Superseded PR runs are worth cancelling; a main-branch run is not, because it may be mid-deploy
  # and job-level concurrency can't save a job whose whole workflow run got cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: workers/mcp-server/package-lock.json

      # `npm ci` against this package's committed lock file (#457).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Ship it. The SITE auto-deploys via Cloudflare Pages on push to main; the Workers did not,
  # and `/release` only ever ran `npm run deploy:worker` (meta-injector). So a green run of the
  # `test` job above meant "tested", never "shipped" — this Worker served 2026-06-22 code until
  # 2026-08-04 while CI stayed green through it, which is how a latent OAuth-discovery bug sat
  # undetected for six weeks. Gated on `test`, and the path filters above already scope the whole
  # workflow to real changes to this Worker.
  #
  # `wrangler deploy` does NOT touch secrets (ANTHROPIC_API_KEY stays put) — it uploads the
  # script, bindings, and the routes declared in wrangler.toml.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Never run two deploys of this Worker at once, and never cancel one midway — unlike the
    # test job, a halted deploy is a half-applied change.
    concurrency:
      group: mcp-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: workers/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Uses the wrangler pinned in this package's devDependencies — the same binary that runs
      # locally — rather than a third-party action resolving its own version.
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # A successful `wrangler deploy` means "uploaded", not "answers requests" — and the gap
      # between those two is the entire reason this workflow exists. So assert against the live
      # URL. This does NOT roll back on failure; the deploy is already applied by this point, so
      # a red run means go look (`npx wrangler rollback` is the escape hatch).
      #
      # Deliberate: the tool assertions below do NOT auto-roll-back either (#223). It is tempting,
      # since a correctness failure means users are getting wrong answers right now. But this
      # server reads its data from the live site via DATA_BASE_URL, so a red tool assertion is
      # ambiguous between "this deploy broke the tool" and "the data underneath moved" — a 404 on
      # a renamed data file, or a stale 300s cache entry. Auto-rollback assumes the first and would
      # revert a perfectly good deploy for a problem it cannot fix. Keep it loud and manual.
      - name: Smoke test the live endpoint
        run: |
          set -euo pipefail
          BASE=https://concerts.morperhaus.org

          # Route changes can take a few seconds to propagate at the edge, so retry rather than
          # racing the deploy we just made.
          hdrs="$(mktemp)"
          for i in $(seq 1 10); do
            body=$(curl -sS --max-time 20 -D "$hdrs" -X POST "$BASE/mcp" \
              -H 'content-type: application/json' \
              -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1"}}}' || true)
            case "$body" in *'"serverInfo"'*) echo "initialize -> ok"; ok=1; break ;; esac
            echo "attempt $i: no serverInfo yet"
            sleep 6
          done
          if [ "${ok:-}" != 1 ]; then
            echo "::error::initialize did not return serverInfo"
            echo "$body"
            exit 1
          fi

          # Every tools/call needs the session minted by initialize.
          SID=$(grep -i '^mcp-session-id:' "$hdrs" | tr -d '\r' | awk '{print $2}')
          if [ -z "${SID:-}" ]; then
            echo "::error::initialize succeeded but returned no Mcp-Session-Id"
            exit 1
          fi

          call_tool() {
            curl -sS --max-time 25 -X POST "$BASE/mcp" \
              -H 'content-type: application/json' \
              -H 'accept: application/json, text/event-stream' \
              -H "mcp-session-id: $SID" \
              -d "$1" || true
          }

          # Assert a tool actually answers correctly, not just that the server is reachable (#223).
          #
          # `initialize` proves the Worker is up. It proves nothing about the data path: this server
          # reads from the live site via DATA_BASE_URL with a 300s cache, so it can be healthy,
          # freshly deployed, and still serving wrong answers because a data file moved, 404s and a
          # tool degraded to empty, or the site shipped data the tools don't handle. None of that
          # touches initialize; all of it changes what a user gets.
          #
          # Marker-matching, not exact prose — narration gets reworded, and asserting a show count
          # would break every time a concert is added.
          artist=$(call_tool '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_artist_history","arguments":{"artist":"Depeche Mode"}}}')
          case "$artist" in
            *'"isError":true'*) echo "::error::get_artist_history returned isError"; echo "$artist"; exit 1 ;;
          esac
          # A bracketed concert id proves the whole path: artist resolved, concerts.json fetched off
          # the live site, show lines rendered.
          case "$artist" in
            *'[concert-'*) echo "tools/call get_artist_history -> ok" ;;
            *) echo "::error::get_artist_history returned no concert id marker"; echo "$artist"; exit 1 ;;
          esac

          # The setlist path is separately load-bearing — it carries per-song cover attribution
          # (#225) and the ?show= deep links the liner notes now emit (#198). Nothing else tests it.
          setlist=$(call_tool '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_concert_setlist","arguments":{"artist":"Nile Rodgers","date":"2026-07-31"}}}')
          case "$setlist" in
            *'"isError":true'*) echo "::error::get_concert_setlist returned isError"; echo "$setlist"; exit 1 ;;
          esac
          # This night is 22-of-25 covers, so "cover)" is a stable canary for attribution surviving.
          case "$setlist" in
            *'cover)'*) echo "tools/call get_concert_setlist -> ok (songs + cover attribution)" ;;
            *) echo "::error::get_concert_setlist lost per-song cover attribution"; echo "$setlist"; exit 1 ;;
          esac

          # Regression guard for #217. If these ever answer 200 again, the Pages SPA catch-all is
          # shadowing them, and MCP clients get pushed into an OAuth flow this server does not
          # implement — which is exactly how Claude Desktop broke on 2026-08-04.
          for path in /.well-known/oauth-authorization-server /.well-known/oauth-protected-resource/mcp /register; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$path")
            if [ "$code" != 404 ]; then
              echo "::error::$path returned $code, expected 404"
              exit 1
            fi
            echo "$path -> 404"
          done
