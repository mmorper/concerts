name: Liner Notes

# Decoupled, independent liner-notes generation. This is the ONLY workflow that
# calls the Anthropic API (the accepted ~$0.10-0.15/run cost). It reads the
# already-committed concert/artist/venue data — it does NOT re-run enrichment.
#
# Runs weekly on a schedule, and on-demand via the "Run workflow" button.
# Generated prose is committed directly (no review gate).

on:
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC (after Data Refresh)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        default: normal
        options:
          - normal     # standard run, 2-3 posts
          - seed       # bootstrap up to 10 posts
          - force      # bypass the 6-month dedup cooldown
          - dry-run    # preview selection only, no API calls, no commit
      date:
        description: 'Override "today" (YYYY-MM-DD), e.g. to test anniversaries'
        type: string
        default: ''

concurrency:
  group: liner-notes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate liner notes
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Alerted when a run publishes nothing; absent → logged only.
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          MODE="${{ inputs.mode }}"
          MODE="${MODE:-normal}"
          ARGS=""
          case "$MODE" in
            seed)    ARGS="--seed" ;;
            force)   ARGS="--force" ;;
            dry-run) ARGS="--dry-run" ;;
          esac
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          echo "Running: npm run generate:liner-notes --$ARGS"
          npm run generate:liner-notes -- $ARGS

      - name: Commit generated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/liner-notes-held.json is the run's memory of failed candidates —
          # committed even on a run that published nothing, so next week's run
          # doesn't pick the same findings again.
          git add public/data/liner-notes.json public/liner-notes.xml public/og/liner-notes data/liner-notes-held.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new liner notes to commit."
          else
            git commit -m "content: generate liner notes [automated]"
            # --autostash: a job step can leave tracked files dirty that this
            # step does not stage — e.g. data/cache/musicbrainz-tracks.json,
            # rewritten by the song->album resolver on any run that fetches a new
            # release-group. Without it the rebase aborts and the commit above is
            # never pushed — work is lost *after* it succeeded (#315).
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # A run that publishes nothing goes red, AFTER the commit above has saved
      # the held list. Red is what makes GitHub email the owner — it needs no
      # NOTIFY_WEBHOOK_URL. Four Mondays published nothing between 2026-09-14
      # and 2026-10-26 as green runs with a warning nobody saw.
      - name: Fail if nothing was published
        if: steps.generate.outputs.published == '0'
        run: |
          echo "::error title=No liner note published::Every candidate failed a check this run. See the Generate step log; the failures are held in data/liner-notes-held.json and skipped next run."
          exit 1
