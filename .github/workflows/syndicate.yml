name: Syndicate

# Outbound social syndication for liner notes (#331).
#
# Runs in Actions rather than a Worker because the pipeline already runs here,
# the secrets already live here, and logs, retries and manual re-runs come free.
# A Worker cron would only win if syndication should be decoupled from the
# build — and it shouldn't: the thing that produces posts is the thing that
# should syndicate them.
#
# The committed ledger (data/syndication-log.json) is the idempotency record.
# It MUST be seeded before the first real run, or 57 published notes fire at
# once: run this workflow manually with mode "seed-ledger" first.

on:
  schedule:
    # 10:00 UTC daily — two hours after Liner Notes on Mondays and three after
    # On This Day every day, so a post's permalink, card and RSS entry are all
    # committed and deployed before anything points at them. A social post that
    # lands before the permalink does is a broken link to a stranger.
    #
    # Daily rather than weekly since #333: On This Day publishes on ~145 days a
    # year and its posts should go out the day they are about, not wait for
    # Monday. A day with nothing to send exits having posted nothing.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        default: normal
        options:
          - normal       # syndicate new notes
          - dry-run      # build payloads and print; post nothing
          - seed-ledger  # suppress the back catalogue (run this FIRST, once)
          - retract      # delete one slug from every channel it posted to
          - pause        # STOP posting. Blank channels = everything
          - resume       # allow posting again
      slug:
        description: 'Slug to retract (mode "retract" only)'
        type: string
        default: ''
      channels:
        description: 'Comma-separated channels; blank = all implemented'
        type: string
        default: ''
      reason:
        description: 'Why (mode "pause" only)'
        type: string
        default: ''
      backlog:
        description: 'Archived notes to drip alongside the new one (0 = off)'
        type: string
        default: '0'

concurrency:
  # Never two fan-outs at once: the ledger is a committed file, and a
  # concurrent run would race the commit and could double-post.
  group: syndicate
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # ── The phone path ──────────────────────────────────────────────────────
      #
      # Stopping this has to be possible from a phone, in seconds, without
      # finding a runbook. The GitHub app can dispatch a workflow, so "pause" is
      # a mode here rather than a thing you can only do from a laptop with the
      # repo checked out.
      #
      # It runs BEFORE the kill-switch gate below on purpose: that gate skips
      # every later step when the switch is engaged, which would make `resume`
      # the one mode that could never run.
      #
      # Inputs go through `env` rather than `${{ }}` interpolation inside the
      # script. A reason string is free text typed on a phone, and interpolating
      # free text into a shell is how a workflow runs something it was not asked
      # to. (The Syndicate step below still interpolates `slug` and `channels`
      # directly — same hazard, pre-existing, worth fixing separately.)
      - name: Pause or resume
        if: inputs.mode == 'pause' || inputs.mode == 'resume'
        env:
          MODE: ${{ inputs.mode }}
          CHANNELS: ${{ inputs.channels }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          ARGS=""
          if [ "$MODE" = "pause" ]; then
            ARGS="--pause"
            printf -v QUOTED '%q' "${REASON:-paused from the GitHub app}"
            ARGS="$ARGS $QUOTED"
          else
            ARGS="--resume"
          fi
          if [ -n "${CHANNELS:-}" ]; then
            printf -v QUOTED_CH '%q' "$CHANNELS"
            ARGS="$ARGS --channels $QUOTED_CH"
          fi

          eval "npm run syndicate -- $ARGS"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/syndication-pause.json
          if git diff --staged --quiet; then
            echo "::notice::Switch already in that state — nothing to commit."
          else
            git commit -m "chore: ${MODE} syndication${CHANNELS:+ (${CHANNELS})} [from workflow]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "::notice::Syndication ${MODE}d${CHANNELS:+ for ${CHANNELS}} and pushed."
          fi

      # The card is DRAWN BY THIS JOB, not fetched from the repo. A rendition is a pure
      # function of (master, channel), so a committed one is stale the moment that function
      # changes (#342) — and Liner Notes runs on a different machine on a different day, so
      # anything it renders without committing is gone by the time this runs. Drawing here
      # removes the staleness by construction.
      #
      # `npm install` fetches puppeteer's bundled Chromium, but not the shared libraries it
      # links against; on ubuntu-latest that is what the `--with-deps` install provides.
      # Without it the browser launches and dies with no useful message.
      - name: Install the browser the card renderer needs
        if: inputs.mode != 'pause' && inputs.mode != 'resume'
        run: npx puppeteer browsers install chrome --install-deps

      # A second, independent layer. The run loop checks the same switch, but a
      # gate here means a paused repo cannot post even if the loop is changed,
      # broken, or bypassed — and the job goes green rather than red, because a
      # deliberate pause is not a failure to be chased.
      - name: Check the kill switch
        id: killswitch
        if: inputs.mode != 'pause' && inputs.mode != 'resume'
        run: |
          set -euo pipefail
          if [ "${SYNDICATION_PAUSED:-}" = "1" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Syndication is PAUSED by repository variable. Nothing will post."
            exit 0
          fi
          if [ -f data/syndication-pause.json ] \
             && node -e "process.exit(JSON.parse(require('fs').readFileSync('data/syndication-pause.json','utf8')).paused === true ? 0 : 1)"; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            REASON=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/syndication-pause.json','utf8')).reason ?? 'no reason recorded')")
            echo "::notice::Syndication is PAUSED — $REASON"
            exit 0
          fi
          echo "paused=false" >> "$GITHUB_OUTPUT"

      - name: Syndicate
        if: steps.killswitch.outputs.paused != 'true' && inputs.mode != 'pause' && inputs.mode != 'resume'
        env:
          SYNDICATION_PAUSED: ${{ vars.SYNDICATION_PAUSED }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"
          MODE="${MODE:-normal}"
          ARGS=""
          case "$MODE" in
            dry-run)     ARGS="--dry-run" ;;
            seed-ledger) ARGS="--seed-ledger" ;;
            retract)
              if [ -z "${{ inputs.slug }}" ]; then
                echo "::error::mode=retract requires a slug"
                exit 1
              fi
              ARGS="--retract ${{ inputs.slug }}"
              ;;
          esac
          if [ -n "${{ inputs.channels }}" ]; then
            ARGS="$ARGS --channels ${{ inputs.channels }}"
          fi
          BACKLOG="${{ inputs.backlog }}"
          if [ -n "${BACKLOG:-}" ] && [ "${BACKLOG}" != "0" ]; then
            ARGS="$ARGS --backlog ${BACKLOG}"
          fi
          npm run syndicate -- $ARGS

      - name: Commit the ledger
        # Runs even when the previous step failed: a partial fan-out has
        # already written rows for the channels that succeeded, and losing
        # those is exactly how the retry double-posts. The job still reports
        # failure — a later always() step does not mask an earlier one.
        if: always() && inputs.mode != 'dry-run' && inputs.mode != 'pause' && inputs.mode != 'resume' && steps.killswitch.outputs.paused != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/syndication-log.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Ledger unchanged."
          else
            git commit -m "content: update syndication ledger [automated]"
            # --autostash: a job step can leave tracked files dirty that this
            # step does not stage — e.g. data/cache/musicbrainz-tracks.json,
            # rewritten by the song->album resolver on any run that fetches a new
            # release-group. Without it the rebase aborts and the commit above is
            # never pushed — work is lost *after* it succeeded (#315).
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
