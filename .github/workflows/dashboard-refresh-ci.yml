name: Dashboard-refresh CI

# Typecheck + tests for the operator-dashboard refresh Worker (Cloudflare GraphQL + ask_turns
# Analytics Engine → KV snapshot). Its own npm package with its own vitest config, so it doesn't
# run as part of the root test suite — this is its automated PR gate. Standalone (no sibling deps).

on:
  push:
    branches: [main]
    paths:
      - 'workers/dashboard-refresh/**'
      - '.github/workflows/dashboard-refresh-ci.yml'
  pull_request:
    paths:
      - 'workers/dashboard-refresh/**'
      - '.github/workflows/dashboard-refresh-ci.yml'

concurrency:
  group: dashboard-refresh-ci-${{ github.ref }}
  # PR runs cancel on supersede; main-branch runs don't, since they may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/dashboard-refresh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # package-lock.json is gitignored for this package, so use `npm install`.
      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # See mcp-ci.yml's deploy job for the full rationale: the site auto-deploys on push, the
  # Workers did not, and `/release` only covered meta-injector. This Worker happened to be in
  # sync on 2026-08-04 only because nothing had changed it since its last manual deploy —
  # luck, not process.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: dashboard-refresh-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/dashboard-refresh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # No post-deploy smoke test here, unlike mcp-ci.yml and ask-chat-ci.yml — deliberately.
      # This Worker is cron-driven with no [[routes]] and no workers.dev, so it has no public
      # surface to probe, and its `fetch` handler is not a health check: it requires REFRESH_KEY
      # and rebuilds the whole snapshot (Cloudflare GraphQL + Analytics Engine + GA + a KV write),
      # i.e. it runs the daily job. Its next scheduled 06:00 UTC run is the real signal.
