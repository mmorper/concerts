name: Now Spinning CI

# Typecheck + tests for the Now Spinning Worker (#687). Runs only when the Worker, the shared
# matching rules it bundles, or this workflow change. The Worker is its own npm package with its
# own vitest config; the root suite excludes workers/**, so this is the automated guard for it.
#
# On push to main it also deploys the Worker (the deploy job below, copied from mcp-ci.yml).

on:
  push:
    branches: [main]
    paths:
      - 'workers/now-spinning/**'
      # Shared code this Worker bundles. A change here must reach the Worker too (#689).
      - 'scripts/utils/song-title.ts'
      - 'scripts/utils/act-name.ts'
      - '.github/workflows/now-spinning-ci.yml'
  pull_request:
    paths:
      - 'workers/now-spinning/**'
      - 'scripts/utils/song-title.ts'
      - 'scripts/utils/act-name.ts'
      - '.github/workflows/now-spinning-ci.yml'

concurrency:
  group: now-spinning-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/now-spinning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: workers/now-spinning/package-lock.json

      # `npm ci` against this package's committed lock file (#457).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Ship it on push to main, gated on `test`. `wrangler deploy` uploads the script, bindings and
  # routes; it does NOT touch secrets. Until both tokens are set (#693) the Worker answers 503 to
  # everything, so the first deploy exposes nothing.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Never run two deploys at once, and never cancel one midway: a halted deploy is half-applied.
    concurrency:
      group: now-spinning-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/now-spinning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: workers/now-spinning/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The wrangler pinned in this package's devDependencies, the same binary that runs locally.
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # "Uploaded" is not "answers requests". An unauthenticated GET must reach this Worker: 503
      # before the secrets are set, 401 after. Anything else (the site's HTML 200, a 404) means the
      # route isn't serving. No rollback: a red run means go look (`npx wrangler rollback`).
      - name: Smoke test the live route
        run: |
          set -euo pipefail
          URL=https://concerts.morperhaus.org/api/now-spinning
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
            case "$code" in
              401) echo "route live, locked (secrets set)"; exit 0 ;;
              503) echo "route live, not configured yet: set the secrets (#693)"; exit 0 ;;
            esac
            echo "attempt $i: got $code"
            sleep 6
          done
          echo "::error::$URL did not answer 401 or 503"
          exit 1
