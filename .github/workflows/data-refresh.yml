name: Data Refresh

# Full enrichment pipeline. Covers: Google Sheet fetch, geocoding, venue photos,
# artist data + photos, top tracks, discography, setlists, validation, facts,
# genres, sitemap, RSS — then incremental MCP narration prose (build-time Haiku).
# (Long-form liner-notes generation still runs in its own workflow.)
#
# Runs weekly on a schedule, and on-demand via the "Run workflow" button
# (Actions tab → Data Refresh → Run workflow). The inputs below let you do
# controlled ad-hoc runs without editing this file.

on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      force_refresh_setlists:
        description: 'Re-fetch ALL setlists, ignoring the cache'
        type: boolean
        default: false
      extra_flags:
        description: 'Extra build-data flags (e.g. "--skip-venues --skip-tracks")'
        type: string
        default: ''

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run enrichment pipeline
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          SHEET_RANGE: ${{ secrets.SHEET_RANGE }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          THEAUDIODB_API_KEY: ${{ secrets.THEAUDIODB_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          VITE_SETLISTFM_API_KEY: ${{ secrets.VITE_SETLISTFM_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ inputs.force_refresh_setlists }}" = "true" ]; then
            FLAGS="$FLAGS --force-refresh-setlists"
          fi
          FLAGS="$FLAGS ${{ inputs.extra_flags }}"
          echo "Running: npm run build-data --$FLAGS"
          npm run build-data -- $FLAGS

      - name: Guard against data regression
        # Converts a silently-degraded run (e.g. expired Google token returning
        # partial sheet data) into an actual job failure, so the built-in GitHub
        # "failed workflow" email fires instead of committing bad data. A hard
        # crash already fails the job above; this catches the quiet cases.
        # ALLOWED_DROP tolerates intentional removals (e.g. a duplicate row).
        run: |
          ALLOWED_DROP=2
          NEW=$(jq '.metadata.totalConcerts // (.concerts | length)' public/data/concerts.json)
          OLD=$(git show HEAD:public/data/concerts.json | jq '.metadata.totalConcerts // (.concerts | length)' 2>/dev/null || echo 0)
          echo "concert count: old=$OLD new=$NEW (allowed drop: $ALLOWED_DROP)"
          if [ "$NEW" -le 0 ]; then
            echo "::error::concerts.json is empty or unreadable after the run"
            exit 1
          fi
          if [ $((OLD - NEW)) -gt "$ALLOWED_DROP" ]; then
            echo "::error::concert count regressed $OLD -> $NEW (drop exceeds $ALLOWED_DROP) — not committing"
            exit 1
          fi
          echo "Regression guard passed."

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Quote the glob so git (not bash) expands it — git's wildcard
          # pathspec silently skips .gitignore'd files (e.g. the pipeline's
          # *.backup.*.json files), whereas a bash-expanded explicit ignored
          # path makes `git add` exit 1 and kills this `bash -e` step.
          git add 'public/data/*.json' public/sitemap.xml public/rss.xml
          git add public/llm.txt public/og-stats.json index.html 2>/dev/null || true
          # The song->album resolver rewrites this cache whenever it fetches a
          # release-group it has not seen. Left unstaged it was set aside by the
          # --autostash below and thrown away with the runner, so CI re-fetched the
          # same release-groups at MusicBrainz's 1 req/sec limit every week (#383).
          # Safe to commit: the writer neither sorts keys nor restamps existing
          # entries, so the diff is append-only — 9 new entries measured at +135/-0.
          # Explicit path, never `git add data/`: syndicate.yml stages
          # data/syndication-log.json itself and the two must not contend for it.
          git add data/cache/musicbrainz-tracks.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh enrichment pipeline [automated]"
            # --autostash because the pipeline may rewrite tracked files this step
            # does not stage. It is now a backstop rather than the main line: the
            # one known offender, data/cache/musicbrainz-tracks.json, is staged
            # above as of #383. Keep the flag for the unknown ones.
            #
            # On 2026-08-17 (run 32007717580) the resolver fetched 9. `git pull --rebase`
            # then aborted with "cannot pull with rebase: You have unstaged
            # changes", and a *successful* enrichment was discarded at the push —
            # which is why the dead venue photos went unrepaired for another five
            # days (#315).
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Generate MCP narration prose (incremental)
        # Build-time Haiku narration for the MCP server's hybrid tools
        # (get_artist_history / get_venue_history). Hash-based: only artists/venues
        # whose facts changed regenerate, so a normal week is a few cents.
        #
        # --limit caps per-run spend: a cold start (narrations never hydrated) or a
        # PROMPT_VERSION bump drains ~25 entities/run (~$0.10) over several weeks
        # instead of a surprise full regen (~$13). For a fast full hydration, run
        # `npm run generate:narrations` (no limit) locally.
        #
        # Runs AFTER the data commit on purpose: a flaky Anthropic week must not block
        # the core data refresh (already pushed above). A hard failure here still fails
        # the job, so the failed-workflow email fires. Skipped if no key is configured.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping narration generation."
            exit 0
          fi
          npm run generate:narrations -- --limit=25

      - name: Commit narrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/narrations
          if git diff --staged --quiet; then
            echo "No narration changes to commit."
          else
            git commit -m "content: refresh MCP narrations [automated]"
            # --autostash: a job step can leave tracked files dirty that this
            # step does not stage — e.g. data/cache/musicbrainz-tracks.json,
            # rewritten by the song->album resolver on any run that fetches a new
            # release-group. Without it the rebase aborts and the commit above is
            # never pushed — work is lost *after* it succeeded (#315).
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
