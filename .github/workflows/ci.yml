name: CI

# Quality gate for the root app (#116): typecheck, tests, build.
#
# Scope note: the Workers are deliberately NOT run here. They are separate npm
# packages with their own vitest configs, and each already has its own
# path-filtered gate — see mcp-ci.yml and ask-chat-ci.yml. The root vitest
# config explicitly excludes `workers/**` (it cannot parse their .md imports),
# so `npm run test:run` covering them is not merely untrue, it is impossible.
# If you add a third worker, give it a workflow rather than folding it in here.
#
# Deploys are not gated: Cloudflare Pages runs its own build on every push.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # package-lock.json is committed (#457). `npm ci` installs exactly what the
      # lock file says, from the setup-node cache when it has it. It used to be
      # gitignored, and every install floated against the live registry — which is
      # how a vitest dist-tag move took every Cloudflare Pages build red on
      # 2026-09-05 with no commit in this repo (#456).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app)
        run: npm run typecheck

      # tsconfig.json is scoped to `src`, so the app typecheck covers none of the
      # liner-notes pipeline, the data pipeline, or the tests. Code with a
      # referenced-but-undeclared variable passed clean until it was run by hand
      # (#246).
      - name: Typecheck (scripts + tests)
        run: npm run typecheck:scripts

      - name: Test
        run: npm run test:run

      # README, docs/ROADMAP.md and CLAUDE.md describe the archive to people
      # who have never used it, and nothing could fail when they stopped being
      # true. README claimed "Five scenes" for seven months after Ask shipped
      # as scene 6 (#283). This compares those claims against the scene roster
      # and concerts.json (#284).
      - name: Validate docs against code and data
        run: npm run validate:docs

      # Catches Vite-time failures that tsc and vitest both miss.
      - name: Build
        run: npm run build

      # The pipeline scripts write real artifacts when run directly, and their
      # tests used to do the same by accident (#207). If a future change makes
      # the suite or the build mutate tracked files again, fail here rather
      # than letting phantom diffs land in someone's next commit.
      - name: Assert no tracked files were modified
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build or tests modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "Working tree clean."
