name: Deploy

# Tag-triggered production deploy to Cloudflare Pages (#13).
#
# Today the site deploys on every push to main via the Pages git integration,
# configured in the Cloudflare dashboard and therefore invisible to this repo.
# This workflow is the replacement: production changes only when a version tag
# is pushed deliberately.
#
# BOTH PATHS ARE CURRENTLY LIVE. The dashboard integration is still enabled on
# purpose — it is the safety net while this one is proven. Deploying twice is
# harmless; having zero working deploy paths is not. Turning the old one off is
# the last step of #13, not the first, and it is a manual dashboard action:
# Workers & Pages → concerts → Settings → Build → Branch control.
#
# Two triggers:
#   - a `v*` tag  → production   (--branch=main)
#   - manual run  → preview only (--branch=deploy-verify)
# The manual path exists so this workflow can be proven end to end without
# shipping anything. A preview deployment gets its own URL and never touches
# concerts.morperhaus.org.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "preview" to deploy to a throwaway preview URL (never production)'
        required: true
        default: 'preview'

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a deploy mid-flight — a half-uploaded Pages deployment is worse
  # than a queued one.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      # package-lock.json is committed (#457), so this is the `npm ci` the spec for
      # #13 asked for: the deployed bundle is built from exactly the tree the lock
      # file pins, not whatever the registry resolves on release day (#456).
      - name: Install dependencies
        run: npm ci

      # `scripts/generate-version.ts` takes the version from package.json when CI
      # is set — NOT from the tag. So a tag that disagrees with package.json would
      # ship a build labelled with the wrong version, silently. `validate:version`
      # already checks tag/changelog/package.json agree, but it is not in any
      # workflow, so assert it here where it can actually stop a deploy.
      - name: Verify tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag: $TAG"
          echo "package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG — the deployed build would claim the wrong version."
            exit 1
          fi

      # Vite inlines VITE_* values at build time, on whichever machine runs the
      # build. That machine is this runner — NOT Cloudflare — so a variable set in
      # the Pages dashboard is invisible here. Anything the client bundle needs has
      # to be passed in explicitly, or it compiles to undefined and the feature
      # silently degrades.
      #
      # Every VITE_* the client actually reads must be listed here. Missing ones do
      # not fail the build — they compile to undefined and the feature turns itself
      # off silently (analytics disabled, Turnstile gate bypassed, Ticketmaster
      # lookups returning null), which is far harder to notice than a crash.
      #
      # VITE_ASK_BASE_URL is deliberately absent — empty means same-origin /api/ask*,
      # which is what production wants.
      - name: Build production bundle
        run: npm run build
        env:
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_SETLISTFM_API_KEY: ${{ secrets.VITE_SETLISTFM_API_KEY }}
          VITE_TICKETMASTER_API_KEY: ${{ secrets.VITE_TICKETMASTER_API_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      # A tag deploys production; a manual run deploys a preview under its own
      # URL. `--branch` is what Cloudflare uses to decide which of the two it is.
      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "kind=production" >> "$GITHUB_OUTPUT"
          else
            echo "branch=deploy-verify" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          fi

      # accountId is pinned rather than read from a secret. The value is already
      # committed in plaintext in all four workers/*/wrangler.toml in this public
      # repo, so a secret would add indirection without adding secrecy. Pinning it
      # also avoids the /memberships lookup that a least-privilege token is not
      # allowed to make — the failure mode documented in
      # workers/dashboard-refresh/wrangler.toml:5-9 (Authentication error 10000).
      # wranglerVersion is pinned deliberately. The action is referenced at `@v3`,
      # a floating major, so the wrangler it installs by default can change on any
      # release of the action — silently changing the tool that ships production.
      # 3.90.0 is what it has installed on every run so far and what this deploy
      # path was verified against. Upgrading is fine, but it should be a commit
      # someone made on purpose and re-verified, not something that arrives on its
      # own between one release and the next.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6db8591bbcba4588ae4ef9c3839cd209
          wranglerVersion: '3.90.0'
          command: >-
            pages deploy dist
            --project-name=concerts
            --branch=${{ steps.target.outputs.branch }}

      # "Uploaded" is not "serving" — the same gap mcp-ci.yml and ask-chat-ci.yml
      # smoke test for. Only assert against production; a preview URL is not known
      # until the deploy returns it and is not worth parsing out for a dry run.
      - name: Smoke test the live site
        if: steps.target.outputs.kind == 'production'
        run: |
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://concerts.morperhaus.org/ || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Site responding 200"
              exit 0
            fi
            echo "attempt $attempt: HTTP $CODE — waiting for propagation"
            sleep 15
          done
          echo "::error::concerts.morperhaus.org did not return 200 after the deploy"
          exit 1

      - name: Summarise
        run: |
          {
            echo "### Deploy: ${{ steps.target.outputs.kind }}"
            echo ""
            echo "- ref: \`${{ github.ref_name }}\`"
            echo "- Pages branch: \`${{ steps.target.outputs.branch }}\`"
            if [ "${{ steps.target.outputs.kind }}" = "preview" ]; then
              echo "- Production was **not** touched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
