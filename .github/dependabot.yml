# Keeps the five lock files moving (#461). The lock files stopped the registry
# from breaking a build behind the repo's back (#456, #457); this stops them
# fossilising. Minor and patch updates arrive as one grouped PR per package per
# week, and each PR runs the full CI — root, scene renderer, the Worker
# workflows and Cloudflare Pages — before anyone looks at it. Majors arrive as
# their own PRs, which is the right signal for something like vitest 4 → 5.
#
# Auto-merge is deliberately NOT configured. It is a policy call; see #461.
#
# DEV-DEPENDENCY MAJORS ARE GROUPED, runtime majors are not (added 2026-09-06).
# The first run opened 18 PRs, and four of them were the same vitest 3 -> 4 bump
# in four Workers. Reviewing that four times is not four decisions, it is one
# decision and three copies. Runtime majors keep their own PRs for exactly the
# reason given above: a lone PR is the right signal for zod 3 -> 4, which lands
# in the MCP tool schemas, and it was that isolation which made the ordering
# problem legible when `agents@0.22` could not resolve against zod 3.
#
# TYPESCRIPT IS EXCLUDED FROM THAT GROUP (added 2026-09-07). Grouping is right
# when the same bump lands in four packages and the answer is the same in all
# four. TypeScript is the opposite case: the compiler version is a property of
# the REPOSITORY, not of a package, and 5 -> 7 crosses two majors. Grouped with
# vitest it produced #494, #496 and #498 — three green, mergeable PRs that would
# have put three Workers on TypeScript 7 while the root stayed on 5.7. A split
# across two compiler majors, arrived at by accident, and CI could not object
# because each Worker typechecks in isolation. That isolation is exactly why it
# would not have announced itself.
#
# It also held the vitest bumps hostage: root is already on vitest 5 and the
# Workers were not, and the only thing stopping that landing was being bundled
# with a decision nobody had made.
#
# So TypeScript keeps its own PR per package, and the upgrade is done ONCE as a
# single branch across the root and all four Workers.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # REACT MOVES AS ONE, AND ITS MAJORS ARE A DECISION (added 2026-10-11).
    # #521 bumped react-dom to 19 while react stayed on 18 — a pair that cannot
    # work, offered as a green-looking PR. React 19 and framer-motion 13 are one
    # planned upgrade, checked against the rendered scenes, not a drip of
    # Dependabot majors. Until then their majors are not proposed at all, and
    # their minors and patches arrive together.
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: framer-motion
        update-types: ["version-update:semver-major"]
      # THE LEAFLET STACK IS THE SAME KIND OF DECISION (added 2026-10-25).
      # react-leaflet 5 and react-leaflet-cluster 4 require React 19, so their
      # majors belong to the React upgrade above, checked against the Map scene,
      # not merged one at a time. #565 offered cluster 4 on its own.
      - dependency-name: leaflet
        update-types: ["version-update:semver-major"]
      - dependency-name: react-leaflet
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-leaflet/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-leaflet-cluster
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      leaflet:
        patterns: [leaflet, react-leaflet, "@react-leaflet/core", react-leaflet-cluster]
      minor-and-patch:
        update-types: [minor, patch]
      dev-majors:
        dependency-type: development
        update-types: [major]
        # TypeScript is excluded so it keeps its OWN PR per package. See the
        # header note — a grouped TS major is a per-package drive-by wearing a
        # batch's clothes.
        exclude-patterns:
          - typescript

  - package-ecosystem: npm
    directory: /workers/ask-chat
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      dev-majors:
        dependency-type: development
        update-types: [major]
        # TypeScript is excluded so it keeps its OWN PR per package. See the
        # header note — a grouped TS major is a per-package drive-by wearing a
        # batch's clothes.
        exclude-patterns:
          - typescript

  - package-ecosystem: npm
    directory: /workers/dashboard-refresh
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      dev-majors:
        dependency-type: development
        update-types: [major]
        # TypeScript is excluded so it keeps its OWN PR per package. See the
        # header note — a grouped TS major is a per-package drive-by wearing a
        # batch's clothes.
        exclude-patterns:
          - typescript

  - package-ecosystem: npm
    directory: /workers/mcp-server
    schedule:
      interval: weekly
      day: monday
    groups:
      # AGENTS AND THE MCP SDK MOVE TOGETHER (added 2026-10-11). `agents` is 0.x,
      # so a "minor" bump can change anything, and it pins an exact peer of
      # @modelcontextprotocol/sdk. Grouped separately they broke twice: zod 3 vs
      # agents@0.22 (header note above), then #547, where agents@0.25 wanted SDK
      # 1.30.0 and the minor group bumped the SDK to 1.32.0 — npm ci failed with
      # ERESOLVE. Listed first so it wins over minor-and-patch.
      mcp-agents:
        patterns: [agents, "@modelcontextprotocol/sdk"]
      minor-and-patch:
        update-types: [minor, patch]
      dev-majors:
        dependency-type: development
        update-types: [major]
        # TypeScript is excluded so it keeps its OWN PR per package. See the
        # header note — a grouped TS major is a per-package drive-by wearing a
        # batch's clothes.
        exclude-patterns:
          - typescript

  - package-ecosystem: npm
    directory: /workers/meta-injector
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      dev-majors:
        dependency-type: development
        update-types: [major]
        # TypeScript is excluded so it keeps its OWN PR per package. See the
        # header note — a grouped TS major is a per-package drive-by wearing a
        # batch's clothes.
        exclude-patterns:
          - typescript

  # deploy.yml already worries, in a comment, that `cloudflare/wrangler-action@v3`
  # is a floating major. This is what would have flagged it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
