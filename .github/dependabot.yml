# Keeps the five lock files moving (#461). The lock files stopped the registry
# from breaking a build behind the repo's back (#456, #457); this stops them
# fossilising. Minor and patch updates arrive as one grouped PR per package per
# week, and each PR runs the full CI — root, scene renderer, the Worker
# workflows and Cloudflare Pages — before anyone looks at it. Majors arrive as
# their own PRs, which is the right signal for something like vitest 4 → 5.
#
# Auto-merge is deliberately NOT configured. It is a policy call; see #461.
#
# DEV-DEPENDENCY MAJORS ARE GROUPED, runtime majors are not (added 2026-09-06).
# The first run opened 18 PRs, and four of them were the same vitest 3 -> 4 bump
# in four Workers. Reviewing that four times is not four decisions, it is one
# decision and three copies. Runtime majors keep their own PRs for exactly the
# reason given above: a lone PR is the right signal for zod 3 -> 4, which lands
# in the MCP tool schemas, and it was that isolation which made the ordering
# problem legible when `agents@0.22` could not resolve against zod 3.
#
# TYPESCRIPT IS EXCLUDED FROM THAT GROUP (added 2026-09-07). Grouping is right
# when the same bump lands in four packages and the answer is the same in all
# four. TypeScript is the opposite case: the compiler version is a property of
# the REPOSITORY, not of a package, and 5 -> 7 crosses two majors. Grouped with
# vitest it produced #494, #496 and #498 — three green, mergeable PRs that would
# have put three Workers on TypeScript 7 while the root stayed on 5.7. A split
# across two compiler majors, arrived at by accident, and CI could not object
# because each Worker typechecks in isolation. That isolation is exactly why it
# would not have announced itself.
#
# It also held the vitest bumps hostage: root is already on vitest 5 and the
# Workers were not, and the only thing stopping that landing was being bundled
# with a decision nobody had made.
#
# So TypeScript keeps its own PR per package, and the upgrade is done ONCE as a
# single branch across the root and all four Workers.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      dev-majors:
        dependency-type: development
        update-types: [major]
        # TypeScript is excluded so it keeps its OWN PR per package. See the
        # header note — a grouped TS major is a per-package drive-by wearing a
        # batch's clothes.
        exclude-patterns:
          - typescript

  - package-ecosystem: npm
    directory: /workers/ask-chat
