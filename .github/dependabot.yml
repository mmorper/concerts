        exclude-patterns:
          - typescript

  # deploy.yml already worries, in a comment, that `cloudflare/wrangler-action@v3`
  # is a floating major. This is what would have flagged it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
